<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ink { stroke: #213444; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .panel { fill: rgba(255,255,255,0.72); stroke: #213444; stroke-width: 3; }
      .soft-panel { fill: rgba(255,255,255,0.55); stroke: #213444; stroke-width: 2.5; }
      .sky { fill: #d8f0ff; }
      .ground { fill: #9fe0b5; }
      .yellow { fill: #f8d95b; stroke: #213444; stroke-width: 3; }
      .blue { fill: #87d1ff; stroke: #213444; stroke-width: 3; }
      .red { fill: #f7a9a9; stroke: #213444; stroke-width: 3; }
      .text { font-family: 'Segoe UI', 'Trebuchet MS', sans-serif; fill: #18314a; }
      .title { font-size: 26px; font-weight: 800; }
      .label { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; }
      .body { font-size: 18px; }
      .button { fill: #ffd84d; stroke: #213444; stroke-width: 3; }
      .button-text { font-size: 20px; font-weight: 800; }
      .muted { fill: #44657d; }
      .shadow { fill: rgba(18, 30, 42, 0.09); }
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="860" rx="30" fill="#f7fbff" stroke="#213444" stroke-width="3"/>

  <g transform="translate(40,35)">
    <rect x="0" y="0" width="1120" height="94" rx="22" fill="#edf7ff" stroke="#213444" stroke-width="3"/>
    <circle cx="58" cy="47" r="27" class="yellow"/>
    <text x="94" y="28" class="text label muted">charity: water</text>
    <text x="94" y="60" class="text title">Water Quest</text>

    <g transform="translate(720,12)">
      <rect x="0" y="0" width="125" height="68" rx="16" fill="#ffffff" stroke="#213444" stroke-width="3"/>
      <text x="62.5" y="23" text-anchor="middle" class="text label muted">SCORE</text>
      <text x="62.5" y="50" text-anchor="middle" class="text title">340</text>
    </g>

    <g transform="translate(860,12)">
      <rect x="0" y="0" width="125" height="68" rx="16" fill="#ffffff" stroke="#213444" stroke-width="3"/>
      <text x="62.5" y="23" text-anchor="middle" class="text label muted">TIME</text>
      <text x="62.5" y="50" text-anchor="middle" class="text title">18</text>
    </g>

    <g transform="translate(1000,12)">
      <rect x="0" y="0" width="110" height="68" rx="16" fill="#ffffff" stroke="#213444" stroke-width="3"/>
      <text x="55" y="23" text-anchor="middle" class="text label muted">BEST</text>
      <text x="55" y="50" text-anchor="middle" class="text title">540</text>
    </g>
  </g>

  <g transform="translate(70,155)">
    <rect x="0" y="0" width="1060" height="560" rx="30" fill="#dff3ff" stroke="#213444" stroke-width="3"/>
    <path d="M0 420 C 150 370, 290 445, 430 410 S 700 470, 820 410 S 1010 385, 1060 432 L1060 560 L0 560 Z" fill="#9fe0b5" stroke="#213444" stroke-width="2.5"/>

    <g opacity="0.5">
      <path d="M120 90 C150 60, 190 60, 220 90" stroke="#213444" stroke-width="3" fill="none"/>
      <path d="M200 75 C230 45, 270 45, 300 75" stroke="#213444" stroke-width="3" fill="none"/>
      <path d="M860 110 C890 80, 930 80, 960 110" stroke="#213444" stroke-width="3" fill="none"/>
      <path d="M920 140 C950 110, 990 110, 1020 140" stroke="#213444" stroke-width="3" fill="none"/>
    </g>

    <g>
      <g transform="translate(130,185)">
        <rect x="0" y="0" width="82" height="100" rx="12" class="yellow"/>
        <rect x="24" y="-16" width="34" height="18" rx="8" class="yellow"/>
        <text x="41" y="58" text-anchor="middle" class="text label" fill="#4a3a12">WATER</text>
      </g>

      <g transform="translate(390,255)">
        <rect x="0" y="0" width="86" height="112" rx="12" class="yellow"/>
        <rect x="25" y="-16" width="36" height="18" rx="8" class="yellow"/>
        <text x="43" y="62" text-anchor="middle" class="text label" fill="#4a3a12">WATER</text>
      </g>

      <g transform="translate(620,210)">
        <rect x="0" y="0" width="92" height="118" rx="12" class="yellow"/>
        <rect x="25" y="-18" width="42" height="18" rx="8" class="yellow"/>
        <text x="46" y="64" text-anchor="middle" class="text label" fill="#4a3a12">WATER</text>
      </g>

      <g transform="translate(860,260)">
        <rect x="0" y="0" width="78" height="102" rx="12" class="yellow"/>
        <rect x="22" y="-15" width="34" height="18" rx="8" class="yellow"/>
        <text x="39" y="58" text-anchor="middle" class="text label" fill="#4a3a12">WATER</text>
      </g>
    </g>

    <g>
      <g transform="translate(770,340)">
        <circle cx="0" cy="0" r="36" class="red"/>
        <text x="0" y="8" text-anchor="middle" class="text title" fill="#ffffff">✕</text>
      </g>
      <g transform="translate(905,125)">
        <circle cx="0" cy="0" r="33" class="red"/>
        <text x="0" y="10" text-anchor="middle" class="text title" fill="#ffffff">✕</text>
      </g>
    </g>

    <g>
      <rect x="310" y="160" width="430" height="218" rx="26" fill="rgba(255,255,255,0.75)" stroke="#213444" stroke-width="3"/>
      <text x="525" y="202" text-anchor="middle" class="text title">Save clean water</text>
      <text x="525" y="236" text-anchor="middle" class="text body muted">Tap the jerry cans before the timer ends.</text>
      <text x="525" y="266" text-anchor="middle" class="text body muted">Collect clean water. Avoid pollution hazards.</text>
      <rect x="465" y="292" width="120" height="42" rx="12" class="button"/>
      <text x="525" y="320" text-anchor="middle" class="text button-text">Start</text>
    </g>

    <g>
      <rect x="330" y="72" width="360" height="82" rx="16" fill="rgba(255,255,255,0.72)" stroke="#213444" stroke-width="3"/>
      <text x="510" y="107" text-anchor="middle" class="text body">Mission live! Tap every can you can find.</text>
    </g>

    <g>
      <circle cx="170" cy="485" r="12" fill="#f8d95b" stroke="#213444" stroke-width="3"/>
      <circle cx="217" cy="485" r="12" fill="#f8d95b" stroke="#213444" stroke-width="3"/>
      <circle cx="264" cy="485" r="12" fill="#f8d95b" stroke="#213444" stroke-width="3"/>
      <text x="305" y="491" class="text body muted">+ points, combo streak, milestone rewards</text>
    </g>
  </g>

  <g transform="translate(70,735)">
    <rect x="0" y="0" width="1060" height="112" rx="20" fill="#edf7ff" stroke="#213444" stroke-width="3"/>

    <g transform="translate(28,18)">
      <rect x="0" y="0" width="170" height="74" rx="14" fill="#ffffff" stroke="#213444" stroke-width="3"/>
      <text x="85" y="26" text-anchor="middle" class="text label muted">MILESTONE</text>
      <text x="85" y="52" text-anchor="middle" class="text title">25 pts</text>
    </g>

    <g transform="translate(260,18)">
      <rect x="0" y="0" width="170" height="74" rx="14" fill="#ffffff" stroke="#213444" stroke-width="3"/>
      <text x="85" y="26" text-anchor="middle" class="text label muted">BEST STREAK</text>
      <text x="85" y="52" text-anchor="middle" class="text title">6</text>
    </g>

    <g transform="translate(490,18)">
      <rect x="0" y="0" width="140" height="74" rx="14" fill="#ffffff" stroke="#213444" stroke-width="3"/>
      <text x="70" y="26" text-anchor="middle" class="text label muted">COMBO</text>
      <text x="70" y="52" text-anchor="middle" class="text title">x4</text>
    </g>

    <g transform="translate(670,18)">
      <rect x="0" y="0" width="140" height="74" rx="14" fill="#ffffff" stroke="#213444" stroke-width="3"/>
      <text x="70" y="26" text-anchor="middle" class="text label muted">LEVEL</text>
      <text x="70" y="52" text-anchor="middle" class="text title">3</text>
    </g>

    <g transform="translate(840,18)">
      <rect x="0" y="0" width="190" height="74" rx="14" fill="#ffffff" stroke="#213444" stroke-width="3"/>
      <text x="95" y="26" text-anchor="middle" class="text label muted">TOP MISSIONS</text>
      <text x="95" y="52" text-anchor="middle" class="text title">540 / 420 / 310</text>
    </g>
  </g>

  <g transform="translate(770,165)">
    <rect x="0" y="0" width="300" height="190" rx="24" fill="rgba(255,255,255,0.82)" stroke="#213444" stroke-width="3"/>
    <text x="150" y="32" text-anchor="middle" class="text label muted">ROUND COMPLETE</text>
    <text x="150" y="65" text-anchor="middle" class="text title">Nice work!</text>
    <text x="150" y="92" text-anchor="middle" class="text body muted">You made a real splash</text>
    <text x="150" y="114" text-anchor="middle" class="text body muted">for clean water.</text>
    <line x1="28" y1="126" x2="272" y2="126" stroke="#213444" stroke-width="2.5"/>
    <text x="76" y="151" class="text body muted">Final Score</text>
    <text x="246" y="151" text-anchor="end" class="text title">340</text>
    <rect x="90" y="160" width="120" height="32" rx="10" class="button"/>
    <text x="150" y="182" text-anchor="middle" class="text button-text">Play again</text>
  </g>
</svg>
